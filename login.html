<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SlimSync</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden; /* No scroll rule */
      background: linear-gradient(to bottom right, var(--color-bg), var(--color-surface));
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: var(--space-6);
      background: var(--color-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .auth-brand {
      font-family: var(--font-heading);
      font-size: var(--size-h3);
      font-weight: var(--weight-h1);
      color: var(--color-text);
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      margin-bottom: var(--space-6);
    }
    .auth-brand span { color: var(--color-primary); }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--color-muted);
      font-size: var(--size-caption);
      margin: var(--space-4) 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .auth-divider::before { margin-right: .25em; }
    .auth-divider::after { margin-left: .25em; }
  </style>
</head>
<body>

  <div class="auth-card animate-fade-up">
    <div class="auth-brand">
      <i class="ph ph-activity"></i><span>Slim</span>Sync
    </div>
    
    <h2 style="font-size: var(--size-h4); margin-bottom: var(--space-1);">Welcome Back</h2>
    <p class="text-muted mb-4">Log in to your patient dashboard</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        <div class="error-text" id="emailError">Valid email required</div>
      </div>
      <div class="form-group">
        <label class="form-label d-flex justify-between">
          Password
          <a href="#" class="text-muted" style="font-size: var(--size-caption);">Forgot?</a>
        </label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        <div class="error-text" id="passError">Password must be at least 8 characters</div>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-2">Login</button>
    </form>

    <div class="auth-divider">OR</div>

    <button class="btn btn-outline w-full mb-2" style="display: flex; justify-content: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <button class="btn btn-outline w-full mb-4">
      <i class="ph ph-envelope-simple"></i> Continue with Email
    </button>

    <p class="text-muted" style="font-size: var(--size-caption);">
      Don't have an account? <a href="register.html">Register</a>
    </p>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      let valid = true;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        valid = false;
      } else {
        document.getElementById('emailError').style.display = 'none';
      }

      if (pass.length < 8) {
        document.getElementById('passError').style.display = 'block';
        valid = false;
      } else {
        document.getElementById('passError').style.display = 'none';
      }

      if(valid) {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
