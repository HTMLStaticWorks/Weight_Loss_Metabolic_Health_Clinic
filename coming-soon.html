<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | SlimSync</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">

  <div class="container animate-fade-up" style="max-width: 600px;">
    <div class="nav-brand" style="justify-content: center; margin-bottom: var(--space-6); font-size: var(--size-h3);">
      <i class="ph ph-activity"></i><span>Slim</span>Sync
    </div>
    <h1 style="margin-bottom: var(--space-2);">Something Big is Coming</h1>
    <p class="text-muted" style="margin-bottom: var(--space-8);">We're redefining metabolic health. Be the first to know when we launch.</p>
    
    <div class="d-flex justify-center gap-4 mb-8" style="font-family: var(--font-heading); font-size: var(--size-h3); color: var(--color-primary);">
      <div>14 <span style="display:block; font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Days</span></div>
      <div>:</div>
      <div>08 <span style="display:block; font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Hours</span></div>
      <div>:</div>
      <div>45 <span style="display:block; font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Mins</span></div>
    </div>

    <form style="display: flex; gap: var(--space-2); max-width: 400px; margin: 0 auto;">
      <input type="email" class="form-control" placeholder="Your email address" required style="flex: 1;">
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>
  </div>

</body>
</html>
