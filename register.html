<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SlimSync</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      padding: var(--space-8) 0;
      background: linear-gradient(to bottom right, var(--color-bg), var(--color-surface));
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: var(--space-6);
      background: var(--color-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .auth-brand {
      font-family: var(--font-heading);
      font-size: var(--size-h3);
      font-weight: var(--weight-h1);
      color: var(--color-text);
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      margin-bottom: var(--space-4);
      text-decoration: none;
    }
    .auth-brand span { color: var(--color-primary); }
    .terms-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      font-size: var(--size-caption);
      color: var(--color-muted);
      cursor: pointer;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--color-muted);
      font-size: var(--size-caption);
      margin: var(--space-4) 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .auth-divider::before { margin-right: .25em; }
    .auth-divider::after { margin-left: .25em; }
    .social-btns {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .password-wrapper {
      position: relative;
      width: 100%;
    }
    .password-toggle {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color var(--transition);
      z-index: 2;
    }
    .password-toggle:hover {
      color: var(--color-text);
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    [dir="rtl"] .password-toggle {
      right: auto;
      left: var(--space-3);
    }
    [dir="rtl"] .password-wrapper input {
      padding-right: var(--space-2);
      padding-left: 40px;
    }
    .auth-card a {
      transition: color var(--transition), text-decoration var(--transition);
    }
    .auth-card a:hover {
      color: var(--color-primary-hover) !important;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Right controls -->
  <div style="position: absolute; top: var(--space-4); right: var(--space-4); display: flex; gap: var(--space-2); z-index: 10;">
    <button class="icon-btn theme-toggle" aria-label="Toggle Theme">
      <i class="ph ph-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" aria-label="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
  </div>

  <div class="auth-card animate-fade-up">
    <a href="index.html" class="auth-brand">
      <i class="ph ph-activity"></i><span>Slim</span>Sync
    </a>
    
    <h2 style="font-size: var(--size-h4); margin-bottom: var(--space-1);">Create Account</h2>
    <p class="text-muted mb-4">Start your metabolic journey</p>
 
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group" style="margin-bottom: var(--space-2);">
        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
      </div>
      <div class="form-group" style="margin-bottom: var(--space-2);">
        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
        <div class="error-text" id="emailError">Valid email required</div>
      </div>
      <div class="form-group" style="margin-bottom: var(--space-2);">
        <div class="password-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Password (min 8 chars)" required>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle Password Visibility">
            <i class="ph ph-eye" style="font-size: 18px;"></i>
          </button>
        </div>
        <div class="error-text" id="passError">Min 8 characters</div>
      </div>
      <div class="form-group">
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle Password Visibility">
            <i class="ph ph-eye" style="font-size: 18px;"></i>
          </button>
        </div>
        <div class="error-text" id="matchError">Passwords do not match</div>
      </div>
      
      <div class="form-group mt-3">
        <label class="terms-label">
          <input type="checkbox" id="terms" style="margin-top: 4px;">
          <span>I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
        </label>
        <div class="error-text" id="termsError">You must accept the terms</div>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-2 mb-4">Register</button>
    </form>

    <div class="auth-divider">OR REGISTER WITH</div>

    <div class="social-btns">
      <button class="btn btn-outline" style="display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <button class="btn btn-outline" style="display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%;">
        <i class="ph-fill ph-apple-logo" style="font-size: 18px;"></i>
        Continue with Apple
      </button>
    </div>

    <p class="text-muted" style="font-size: var(--size-caption);">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ph ph-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'ph ph-eye';
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;
      
      let valid = true;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        valid = false;
      } else { document.getElementById('emailError').style.display = 'none'; }

      if (pass.length < 8) {
        document.getElementById('passError').style.display = 'block';
        valid = false;
      } else { document.getElementById('passError').style.display = 'none'; }

      if (pass !== confirm || confirm === '') {
        document.getElementById('matchError').style.display = 'block';
        valid = false;
      } else { document.getElementById('matchError').style.display = 'none'; }

      if (!terms) {
        document.getElementById('termsError').style.display = 'block';
        valid = false;
      } else { document.getElementById('termsError').style.display = 'none'; }

      if(valid) {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
